# Build Consul for Linux amd64 and upload the ZIP, DEB, RPM, and release
# metadata as workflow artifacts. This workflow is intentionally scoped to the
# same release-oriented use case as Nomad's my_build workflow.
name: my_build

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'The git ref to build from'
        type: string
        default: ''
        required: false

permissions:
  contents: read
  id-token: write

env:
  PKG_NAME: consul
  METADATA: oss

jobs:
  get-go-version:
    runs-on: ubuntu-22.04
    outputs:
      go-version: ${{ steps.get-go-version.outputs.go-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.build-ref }}

      - name: Determine Go version
        id: get-go-version
        run: |
          GO_VERSION=$(head -n 1 .go-version)
          echo "Building with Go ${GO_VERSION}"
          echo "go-version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

  get-product-version:
    runs-on: ubuntu-22.04
    outputs:
      product-version: ${{ steps.set-product-version.outputs.product-version }}
      prerelease-version: ${{ steps.set-product-version.outputs.prerelease-product-version }}
      product-date: ${{ steps.get-product-date.outputs.product-date }}
      source-sha: ${{ steps.get-source-sha.outputs.source-sha }}
      shared-ldflags: ${{ steps.shared-ldflags.outputs.shared-ldflags }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.build-ref }}

      - name: Determine product version
        id: set-product-version
        uses: hashicorp/actions-set-product-version@v2

      - name: Determine product date
        id: get-product-date
        run: |
          PRODUCT_DATE=$(build-support/scripts/build-date.sh)
          echo "product-date=${PRODUCT_DATE}" >> "$GITHUB_OUTPUT"

      - name: Determine source commit
        id: get-source-sha
        run: echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set shared ldflags
        id: shared-ldflags
        env:
          PRODUCT_VERSION: ${{ steps.set-product-version.outputs.product-version }}
          PRODUCT_DATE: ${{ steps.get-product-date.outputs.product-date }}
          SOURCE_SHA: ${{ steps.get-source-sha.outputs.source-sha }}
        run: |
          VERSION_PACKAGE=github.com/hashicorp/consul/version
          echo "shared-ldflags=-X ${VERSION_PACKAGE}.GitCommit=${SOURCE_SHA::8} -X ${VERSION_PACKAGE}.GitDescribe=${PRODUCT_VERSION} -X ${VERSION_PACKAGE}.BuildDate=${PRODUCT_DATE}" >> "$GITHUB_OUTPUT"

  generate-metadata-file:
    needs: get-product-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.build-ref }}

      - name: Generate metadata file
        id: generate-metadata-file
        uses: hashicorp/actions-generate-metadata@fdbc8803a0e53bcbb912ddeee3808329033d6357 # v1.1.1
        with:
          version: ${{ needs.get-product-version.outputs.product-version }}
          product: ${{ env.PKG_NAME }}
          repositoryOwner: ${{ github.repository_owner }}
          sha: ${{ needs.get-product-version.outputs.source-sha }}

      - name: Upload metadata
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: metadata.json
          path: ${{ steps.generate-metadata-file.outputs.filepath }}

  build-linux:
    needs:
      - get-go-version
      - get-product-version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        goos: [linux]
        goarch: [amd64]
    name: Go ${{ needs.get-go-version.outputs.go-version }} ${{ matrix.goos }} ${{ matrix.goarch }} build
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.build-ref }}

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d7c24378f7a8b2b71e75b2a0d2d # v4.0.3
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Build UI
        env:
          CONSUL_VERSION: ${{ needs.get-product-version.outputs.product-version }}
          CONSUL_DATE: ${{ needs.get-product-version.outputs.product-date }}
          CONSUL_BINARY_TYPE: oss
        run: |
          export CONSUL_COPYRIGHT_YEAR
          CONSUL_COPYRIGHT_YEAR=$(git show -s --format=%cd --date=format:%Y HEAD)
          make -C ui
          rm -rf agent/uiserver/dist
          mv ui/packages/consul-ui/dist agent/uiserver/

      - name: Build Consul
        env:
          PRODUCT_VERSION: ${{ needs.get-product-version.outputs.product-version }}
          PRERELEASE_VERSION: ${{ needs.get-product-version.outputs.prerelease-version }}
          CGO_ENABLED: '0'
          GOLDFLAGS: ${{ needs.get-product-version.outputs.shared-ldflags }}
        uses: hashicorp/actions-go-build@b9e2cfba3013adccdc112b01cba922d83c78fac5 # v1.1.1
        with:
          product_name: ${{ env.PKG_NAME }}
          product_version: ${{ needs.get-product-version.outputs.product-version }}
          go_version: ${{ needs.get-go-version.outputs.go-version }}
          os: ${{ matrix.goos }}
          arch: ${{ matrix.goarch }}
          reproducible: nope
          clean: false
          instructions: |-
            cp LICENSE "$TARGET_DIR/LICENSE.txt"
            go build -ldflags="$GOLDFLAGS" -o "$BIN_PATH" -trimpath -buildvcs=false

      - name: Prepare Linux package files
        env:
          LICENSE_DIR: .release/linux/package/usr/share/doc/consul
        run: |
          mkdir -p "$LICENSE_DIR"
          cp LICENSE "$LICENSE_DIR/LICENSE.txt"

      - name: Build DEB and RPM packages
        uses: hashicorp/actions-packaging-linux@8d55a640bb30b5508f16757ea908b274564792d4 # v1.8.0
        with:
          name: ${{ env.PKG_NAME }}
          description: 'Consul is a distributed, highly available service networking solution.'
          arch: ${{ matrix.goarch }}
          version: ${{ needs.get-product-version.outputs.product-version }}
          maintainer: HashiCorp
          homepage: https://github.com/hashicorp/consul
          license: BSL-1.1
          binary: dist/${{ env.PKG_NAME }}
          deb_depends: openssl
          rpm_depends: openssl
          config_dir: .release/linux/package
          preinstall: .release/linux/preinstall
          postinstall: .release/linux/postinstall
          preremove: .release/linux/preremove
          postremove: .release/linux/postremove

      - name: Determine package names
        run: |
          echo "RPM_PACKAGE=$(basename out/*.rpm)" >> "$GITHUB_ENV"
          echo "DEB_PACKAGE=$(basename out/*.deb)" >> "$GITHUB_ENV"

      - name: Upload RPM package
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ env.RPM_PACKAGE }}
          path: out/${{ env.RPM_PACKAGE }}
          if-no-files-found: error

      - name: Upload DEB package
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ env.DEB_PACKAGE }}
          path: out/${{ env.DEB_PACKAGE }}
          if-no-files-found: error
